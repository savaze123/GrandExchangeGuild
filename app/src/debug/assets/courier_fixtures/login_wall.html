<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Candidate Portal - Sign In Required</title>
</head>
<body>
    <main class="auth-wall">
        <h1>Sign In to Continue Your Application</h1>
        <form id="login_form" action="#login" method="post">
            <div class="field">
                <label for="login_email">Email Address *</label>
                <input id="login_email" name="username" type="email" required />
            </div>
            <div class="field">
                <label for="login_password">Password *</label>
                <input id="login_password" name="password" type="password" required />
            </div>
            <button id="login_submit" type="submit">Sign In</button>
        </form>
        <p><a href="#create-account">Create an Account</a></p>
    </main>
</body>
</html>
